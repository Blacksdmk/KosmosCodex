<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>KOSMOS | Administracion</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">KOSMOS <span>ADMINISTRACION</span></a></header>
  <main class="admin-shell">
    <section id="auth-gate">
      <p class="eyebrow">USO PRIVADO</p>
      <h1>Acceso al Archivo</h1>
      <p class="page-lead">Inicia sesion con una cuenta autorizada de KOSMOS.</p>
      <form id="login-form" class="admin-form">
        <label>Correo<input id="login-email" type="email" autocomplete="email" required placeholder="correo@ejemplo.com"></label>
        <label>Contrasena<input id="login-password" type="password" autocomplete="current-password" required placeholder="Contrasena"></label>
        <button class="button primary" type="submit">Iniciar sesion</button>
        <p class="notice" id="auth-message"></p>
      </form>
    </section>

    <section id="editor" hidden>
      <p class="eyebrow">USO PRIVADO</p>
      <h1>Editor del Archivo</h1>
      <p class="page-lead">Crea entradas para el Codex. Los cambios se publican en Firebase de inmediato.</p>
      <form id="admin-form" class="admin-form">
        <label>Apartado del Archivo<select id="entry-type"><option value="reports">Biblioteca / Informe</option><option value="races">Razas</option><option value="places">Lugares</option><option value="factions">Facciones</option><option value="magic">Magia</option><option value="bestiary">Bestiario</option></select></label>
        <label>Entrada a editar<select id="existing-entry"><option value="">Nueva entrada</option></select></label>
        <button class="button" id="load-entry" type="button">Cargar entrada</button>
        <label>Categoria o clasificacion<input id="category" required placeholder="Ej. cronologia, linaje, criatura o escuela"></label>
        <label>Titulo o nombre<input id="title" required maxlength="90"></label>
        <label>Resumen<textarea id="summary" required maxlength="180"></textarea></label>
        <label id="content-field">Contenido completo<textarea id="content" required rows="10" placeholder="Escribe aqui la informacion completa que aparecera al abrir este registro."></textarea></label>
        <label id="status-field">Estado<select id="status"><option value="public">Publico</option><option value="locked">Restringido</option></select></label>
        <button class="button primary" id="save-entry" type="submit">Publicar entrada</button>
        <button class="button" id="logout" type="button">Cerrar sesion</button>
        <p class="notice" id="admin-message">Tu cuenta tiene permisos de administracion.</p>
      </form>
    </section>
  </main>
  <footer>ARCHIVO DEL NUCLEO · KOSMOS</footer>
  <script src="script.js"></script>
</body>
</html>
